[package]
name = "k-pdf-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "k-pdf: a fast, low-memory desktop PDF viewer and editor"

# The application is called k-pdf (the command-line tool is k-pdf-cli).
[[bin]]
name = "k-pdf"
path = "src/main.rs"

[features]
# `--script steps.txt`: plays scripted input (for testing; see src/script.rs).
script = []

[dependencies]
k-pdf = { path = "..", features = ["render", "compress", "ocr"] }
# OpenGL (glow) backend instead of wgpu: smaller binary, lower memory.
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17.2"
# Checks that the system UI font is readable (already used by k-pdf).
ttf-parser = "0.25.1"

# The icon and version information of k-pdf.exe (see build.rs).
[target.'cfg(windows)'.dependencies]
# Printing through GDI (src/print/windows.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
