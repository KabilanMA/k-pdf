# Builds the Linux release of k-pdf and, for a version tag (v0.1.0, …),
# publishes it as a GitHub release. Run it by hand (Actions → Release →
# Run workflow) to just get the archive as a build artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported Ubuntu, so the program runs on older systems too
    # (it needs the C library version of the system it was built on or newer).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: System libraries for the window (X11, Wayland, OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Test
        run: cargo test --release --workspace --locked

      - name: Package
        id: package
        run: echo "archive=$(packaging/linux/package.sh | tail -n 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: k-pdf-linux
          path: ${{ steps.package.outputs.archive }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
          generate_release_notes: true
