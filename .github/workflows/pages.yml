# Builds the website (site/) and publishes it on GitHub Pages.
#
# It runs when the site changes on master, when the Release workflow has
# published a new version (that workflow starts this one at its end, so the
# site links to the new downloads and gets a news post), when a release is
# published, edited or deleted by hand on GitHub, and from Actions → Website
# → Run workflow.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
name: Website

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "bench/results/**"
      - "packaging/linux/k-pdf.svg"
      - ".github/workflows/pages.yml"
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run waits instead of cancelling one
# that is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Release events run on the tag, but Pages only accepts deployments from
  # master, so they start a run on master instead.
  from-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild the website from master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags and history, to list the changes between releases.
          fetch-depth: 0
      - name: Read the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[]' > releases.jsonl
      - name: Build the site
        run: python3 site/build.py --releases releases.jsonl --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
